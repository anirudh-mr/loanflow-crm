# Alembic configuration for LoanFlow CRM

[alembic]
# Path to migration scripts
script_location = migrations

# Template used to generate migration files
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Truncate long revision identifiers to 12 characters
truncate_slug_length = 40

# Set to 'true' to run the environment against multiple databases
# (not needed for LoanFlow)
# sourceless = false

# Timezone to use when rendering the date in the migration file name
# timezone =

# Max length of characters in the "slug" field
# truncate_slug_length = 40

# Set to true to search source files recursively
# in each "version_locations" directory
# recursive_version_locations = false

# The output encoding used when revision files are written
output_encoding = utf-8

# Note: sqlalchemy.url is set programmatically in migrations/env.py
# from app.core.config.settings.DATABASE_URL so it stays in one place.
# sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]
# Uncomment to run black on new migration files
# hooks = black
# black.type = console_scripts
# black.entrypoint = black

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
