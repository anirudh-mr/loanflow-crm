services:
  - type: web
    name: loanflow-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.db.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: loanflow-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 480
      - key: BACKEND_CORS_ORIGINS
        value: '["*"]'

databases:
  - name: loanflow-db
    databaseName: loanflow
    user: loanflow_user
    plan: free
